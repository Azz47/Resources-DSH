      text: "4.新中国成立之初，我国“连铁钉和火柴都需要进口”，工业基础薄弱，科技前沿几近空白。 77 载岁月，神州大地天翻地覆：如今，我国建成全球最完整、规模最大的研发体系和工业体系，进入创新型国家行列——“奋斗者”号深潜万米，“中国天眼”巡天观测，中国空间站遨游太空，国产大模型引领全球开源生态……这些成就的背后，是一以贯之的方向引领。 党中央提出“以科技创新为引领，大力培育壮大新兴产业和未来产业”，从基础研究的系统部署，到“十五五”规划对新兴产业的整体布局，再到广大科技工作者数十年如一日地攻关“卡脖子”难题……一代代人接力奋斗，让“中国制造”加速迈向“中国创造”。"
